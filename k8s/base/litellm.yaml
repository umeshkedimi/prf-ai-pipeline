# The LiteLLM proxy. Its config file is NOT duplicated here -- kustomization.yaml
# generates the ConfigMap directly from litellm/config.yaml, so the cluster and
# docker-compose read the same single source of truth and cannot drift.
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels: { app.kubernetes.io/name: litellm }
spec:
  selector: { app.kubernetes.io/name: litellm }
  ports: [{ port: 4000, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: litellm }
  template:
    metadata:
      labels: { app.kubernetes.io/name: litellm }
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          env:
            # This is the only pod that talks to a model backend, so the
            # awkward "how does a pod reach Ollama" question is confined to one
            # place. Base assumes an in-cluster Ollama Service; the kind overlay
            # repoints it at the host. That containment is a direct payoff of
            # putting the proxy in front of the pipeline.
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef: { name: prf-config, key: OLLAMA_BASE_URL }
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: prf-api-keys, key: LITELLM_MASTER_KEY }
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef: { name: prf-api-keys, key: GOOGLE_API_KEY }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: prf-api-keys, key: ANTHROPIC_API_KEY }
          ports: [{ containerPort: 4000 }]
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          readinessProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            # 2Gi, not the 1Gi this started at: the proxy loads a large
            # model-cost map at startup and was OOMKilled (exit 137) six times
            # in seven minutes on the first live apply. Nothing in
            # docker-compose caught this -- compose sets no memory limit at all,
            # so the process simply took what it needed. Declaring limits is
            # what surfaced the real footprint.
            limits: { memory: 2Gi }
      volumes:
        - name: config
          configMap:
            name: litellm-config
