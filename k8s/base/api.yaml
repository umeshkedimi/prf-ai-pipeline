# The FastAPI service. ClusterIP in the base -- how it is exposed is an
# environment decision (NodePort on kind, an ALB Ingress on EKS), so it belongs
# in an overlay, not here.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  selector: { app.kubernetes.io/name: api }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api }
    spec:
      containers:
        - name: api
          image: prf-backend:local
          envFrom:
            - configMapRef: { name: prf-config }
            - secretRef: { name: prf-api-keys }
          ports: [{ containerPort: 8000 }]
          # Readiness gates traffic; liveness restarts a wedged process. Both
          # point at the real /health endpoint rather than a bare TCP check, so
          # a process that is listening but broken is still caught.
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 45
            periodSeconds: 20
          volumeMounts:
            # Shared with celery-worker: the worker writes generated PDFs, the
            # API serves them via GET /workflow/{id}/pdf. See storage.yaml for
            # why this is the one genuinely cloud-hostile piece.
            - name: storage
              mountPath: /app/storage
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: prf-storage
