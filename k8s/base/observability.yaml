# Jaeger (traces) and Prometheus (metrics). Grafana lives in grafana.yaml.
#
# All three are single-replica, storage-less dev deployments: Jaeger's
# all-in-one image keeps spans in memory, and Prometheus here has no PVC. That
# is the right trade for a demo cluster and the wrong one for production, where
# these would be a managed service or a properly-provisioned operator install.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels: { app.kubernetes.io/name: jaeger }
spec:
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: 16686 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - { containerPort: 16686 }
            - { containerPort: 4317 }
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  # Static targets rather than Kubernetes service discovery. Deliberate: SD
  # would need a ServiceAccount, ClusterRole and binding for Prometheus to list
  # endpoints, and that RBAC belongs in a real observability story rather than
  # smuggled into a first manifest set. Two targets do not justify it.
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prf-api
        static_configs:
          - targets: ["api:8000"]
      - job_name: prf-celery-worker
        static_configs:
          - targets: ["celery-worker:9100"]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
