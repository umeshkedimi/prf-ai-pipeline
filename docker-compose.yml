name: prf-ai-pipeline

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prf}
      POSTGRES_DB: ${POSTGRES_DB:-prf_ai_pipeline}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prf} -d ${POSTGRES_DB:-prf_ai_pipeline}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-crm:
    build: ./backend
    command: ["python", "-m", "app.mcp_servers.crm.server"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prf}:${POSTGRES_PASSWORD:-prf}@postgres:5432/${POSTGRES_DB:-prf_ai_pipeline}
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8100), 2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-address:
    build: ./backend
    command: ["python", "-m", "app.mcp_servers.address.server"]
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8101), 2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-compliance:
    build: ./backend
    command: ["python", "-m", "app.mcp_servers.compliance.server"]
    ports:
      - "8102:8102"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8102), 2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-print-vendor:
    build: ./backend
    command: ["python", "-m", "app.mcp_servers.print_vendor.server"]
    ports:
      - "8103:8103"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8103), 2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-prf-local}
      # The proxy is the process that now talks to Ollama, so it needs the
      # host-gateway address for the same reason api/celery-worker do — inside
      # a container, localhost:11434 is the container, not the host running
      # Ollama.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 4000), 2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC (api/celery-worker export traces here)

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - celery-worker

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  celery-worker:
    build: ./backend
    # --concurrency=1: prometheus_client's registry is per-process, not
    # fork-aware (see workers/metrics.py) -- one worker process is also all
    # this demo's single-run-at-a-time load needs.
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    ports:
      - "9100:9100" # Prometheus metrics (workers/metrics.py)
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      CELERY_METRICS_PORT: "9100"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prf}:${POSTGRES_PASSWORD:-prf}@postgres:5432/${POSTGRES_DB:-prf_ai_pipeline}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-prf}:${POSTGRES_PASSWORD:-prf}@postgres:5432/${POSTGRES_DB:-prf_ai_pipeline}
      CHECKPOINTER_DATABASE_URL: postgresql://${POSTGRES_USER:-prf}:${POSTGRES_PASSWORD:-prf}@postgres:5432/${POSTGRES_DB:-prf_ai_pipeline}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MCP_CRM_URL: http://mcp-crm:8100/mcp
      MCP_ADDRESS_URL: http://mcp-address:8101/mcp
      MCP_COMPLIANCE_URL: http://mcp-compliance:8102/mcp
      MCP_PRINT_VENDOR_URL: http://mcp-print-vendor:8103/mcp
      LLM_PROVIDER: ${LLM_PROVIDER:-google_genai}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-google_genai}
      JUDGE_MODEL: ${JUDGE_MODEL:-gemini-2.5-flash-lite}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000/v1}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-prf-local}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # generate_pdf writes to <repo>/storage/letters (see render.py's
      # LETTER_STORAGE_DIR); without this it only ever exists inside the
      # container and vanishes with it.
      - ./backend/storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-crm:
        condition: service_healthy
      mcp-address:
        condition: service_healthy
      mcp-compliance:
        condition: service_healthy
      mcp-print-vendor:
        condition: service_healthy
      litellm:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prf}:${POSTGRES_PASSWORD:-prf}@postgres:5432/${POSTGRES_DB:-prf_ai_pipeline}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-prf}:${POSTGRES_PASSWORD:-prf}@postgres:5432/${POSTGRES_DB:-prf_ai_pipeline}
      CHECKPOINTER_DATABASE_URL: postgresql://${POSTGRES_USER:-prf}:${POSTGRES_PASSWORD:-prf}@postgres:5432/${POSTGRES_DB:-prf_ai_pipeline}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MCP_CRM_URL: http://mcp-crm:8100/mcp
      MCP_ADDRESS_URL: http://mcp-address:8101/mcp
      MCP_COMPLIANCE_URL: http://mcp-compliance:8102/mcp
      MCP_PRINT_VENDOR_URL: http://mcp-print-vendor:8103/mcp
      LLM_PROVIDER: ${LLM_PROVIDER:-google_genai}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-google_genai}
      JUDGE_MODEL: ${JUDGE_MODEL:-gemini-2.5-flash-lite}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000/v1}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-prf-local}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      # Same mount as celery-worker (see its comment) -- the API needs to
      # read a letter PDF to serve it via GET /workflow/{id}/pdf; it never
      # writes here itself.
      - ./backend/storage:/app/storage
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-crm:
        condition: service_healthy
      mcp-address:
        condition: service_healthy
      mcp-compliance:
        condition: service_healthy
      mcp-print-vendor:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
